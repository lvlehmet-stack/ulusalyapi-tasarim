<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün Evreni — Seçenek C · 3D Efektli</title>

<style>
:root{
  --bg:#f5f8fc;--bg2:#edf2f9;--surface:#ffffff;--surface2:#f3f7fc;
  --line:rgba(22,36,60,.12);--text:#16243c;--muted:#53627e;
  --accent:#2b62c4;--accent2:#1d4fa8;--ice:#1d4fa8;--red:#d0242b;
  --grad:linear-gradient(96deg,#4b84e0 0%,#2b62c4 100%);--on-accent:#ffffff;--radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;line-height:1.75;min-height:100vh;overflow-x:hidden;padding:clamp(28px,5vh,64px) clamp(16px,4vw,60px)}
h2,h3,h4{font-family:'Syne',sans-serif;line-height:1.1;font-weight:700;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
.demo-tag{position:fixed;top:14px;right:14px;z-index:99;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.08em;background:var(--text);color:#fff;box-shadow:0 8px 22px rgba(22,36,60,.25)}
.stage{max-width:1220px;margin:0 auto}
.head{text-align:center}
.sec-no{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent2);letter-spacing:.2em}
.sec-title{font-size:clamp(26px,4vw,44px);margin:10px 0 12px}
.sec-title em{font-style:normal;color:var(--accent2)}
.sec-desc{max-width:640px;margin:0 auto;color:var(--muted);font-size:15px}
.panel{
  position:relative;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 20px 54px rgba(22,36,60,.10);
  height:min(680px,88vh);display:flex;flex-direction:column;overflow:hidden;
}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4b84e0,#2b62c4 72%,var(--red));z-index:3}
.panel-visual{position:relative;height:148px;flex:none;overflow:hidden;background:#eef3fa;border-bottom:1px solid var(--line)}
.panel-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.panel-visual img.on{opacity:1}
.panel-head{display:flex;align-items:center;gap:15px;padding:20px 26px 12px}
.panel-head .p-ic{width:50px;height:50px;flex:none;border-radius:10px;background:var(--grad);color:var(--on-accent);display:grid;place-items:center}
.panel-head .p-ic svg{width:25px;height:25px}
.panel-head h3{font-size:20px;line-height:1.2}
.panel-head .p-count{font-size:12.5px;color:var(--muted);margin-top:2px}
.panel-desc{padding:0 26px;font-size:13.5px;color:var(--muted)}
.panel-body{flex:1;overflow-y:auto;padding:14px 26px 18px;scrollbar-width:thin;scrollbar-color:rgba(43,98,196,.3) transparent}
.panel-body::-webkit-scrollbar{width:7px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(43,98,196,.25);border-radius:99px}
.sub-cat{margin:16px 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:10px}
.sub-cat:first-child{margin-top:2px}
.sub-cat::after{content:"";flex:1;height:1px;background:var(--line)}
.sub-item{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--surface2);transition:border-color .3s,box-shadow .3s}
.sub-item:hover{border-color:rgba(43,98,196,.32)}
.sub-item>button{
  width:100%;display:flex;align-items:center;gap:11px;padding:12px 15px;background:none;border:0;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--text);text-align:left;
}
.sub-item .dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(208,36,43,.14)}
.sub-item .chev{margin-left:auto;flex:none;transition:transform .35s;color:var(--muted)}
.sub-item .si-body{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.2,.7,.3,1)}
.sub-item.open{border-color:rgba(43,98,196,.45);box-shadow:0 8px 22px rgba(22,36,60,.08)}
.sub-item.open .chev{transform:rotate(180deg)}
.sub-item.open .si-body{max-height:220px}
.sub-item .si-in{padding:0 15px 13px 33px;font-size:13px;color:var(--muted)}
.sub-item .si-in a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:700;color:var(--accent2);font-size:12.5px}
.sub-item .si-in a:hover{text-decoration:underline}
.panel-foot{padding:15px 26px;border-top:1px solid var(--line);background:var(--surface2)}
.visit-btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:14px 22px;border-radius:var(--radius);background:var(--grad);color:var(--on-accent);
  font-weight:700;font-size:14px;letter-spacing:.04em;overflow:hidden;
  box-shadow:0 10px 26px rgba(43,98,196,.32);
  transition:transform .3s,box-shadow .3s;
}
.visit-btn:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(43,98,196,.46)}
.visit-btn::after{
  content:"";position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-22deg);animation:shine 3.2s ease infinite;
}
@keyframes shine{0%{left:-80%}55%,100%{left:130%}}
.visit-btn svg{transition:transform .3s}
.visit-btn:hover svg{transform:translateX(4px)}
.panel-fade .panel-head,.panel-fade .panel-desc,.panel-fade .panel-body{animation:panelin .45s cubic-bezier(.2,.7,.3,1)}
@keyframes panelin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Seçenek C: 3D Efektli ---------- */
.hub{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(26px,3.5vw,48px);align-items:center;margin-top:44px}
.scene{position:relative;perspective:1200px}
.orb{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.o1{width:46%;aspect-ratio:1;left:-6%;top:-4%;background:rgba(75,132,224,.28);animation:drift 9s ease-in-out infinite}
.o2{width:30%;aspect-ratio:1;right:-4%;bottom:-2%;background:rgba(208,36,43,.14);animation:drift 11s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(4%,6%)}}
.tilt{
  position:relative;aspect-ratio:1;max-width:540px;width:100%;margin:0 auto;
  transform-style:preserve-3d;transition:transform .25s ease-out;user-select:none;
}
.disc{
  position:absolute;left:50%;top:50%;width:32%;aspect-ratio:1;z-index:4;
  transform:translate(-50%,-50%) translateZ(50px);transform-style:preserve-3d;
  border-radius:50%;background:var(--surface);display:grid;place-items:center;
  box-shadow:0 34px 64px rgba(22,36,60,.28),0 0 0 1px var(--line);
  animation:float 5.5s ease-in-out infinite;
}
@keyframes float{50%{transform:translate(-50%,-53%) translateZ(50px)}}
.disc img{width:70%}
.ring{position:absolute;inset:-11%;border-radius:50%;border:1.5px dashed rgba(43,98,196,.45);animation:spin 15s linear infinite}
.ring::after{
  content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;
  background:var(--red);box-shadow:0 0 12px rgba(208,36,43,.7);
}
@keyframes spin{to{transform:rotate(360deg)}}
.gshadow{
  position:absolute;left:50%;top:88%;width:52%;height:6%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(22,36,60,.16),transparent 68%);
  animation:shpulse 5.5s ease-in-out infinite;pointer-events:none;
}
@keyframes shpulse{50%{transform:translateX(-50%) scale(.92);opacity:.75}}
.g-node{
  position:absolute;width:40%;transform:translate(-50%,-50%) translateZ(12px);z-index:5;
  border:1px solid rgba(255,255,255,.85);border-radius:14px;overflow:hidden;padding:0;
  background:rgba(255,255,255,.74);backdrop-filter:blur(10px);text-align:left;
  box-shadow:0 20px 44px rgba(22,36,60,.16);
  transition:transform .45s cubic-bezier(.2,.7,.3,1),box-shadow .45s,border-color .45s;
}
.g-node:hover{transform:translate(-50%,-50%) translateZ(58px) scale(1.04);box-shadow:0 34px 60px rgba(22,36,60,.24);z-index:7}
.g-node.active{border-color:rgba(43,98,196,.55);box-shadow:0 26px 54px rgba(43,98,196,.32);z-index:6}
.g-node::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:opacity .4s;z-index:2}
.g-node.active::before{opacity:1}
.g-node::after{
  content:"";position:absolute;top:0;left:-90%;width:50%;height:100%;z-index:2;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-22deg);animation:shine2 4.6s ease infinite;
}
@keyframes shine2{0%{left:-90%}60%,100%{left:140%}}
.g-node .cimg{display:block;width:100%;aspect-ratio:16/9.5;position:relative;overflow:hidden;background:#eef3fa}
.g-node .cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.g-node:hover .cimg img{transform:scale(1.06)}
.g-node .ctx{display:block;padding:9px 14px 11px}
.g-node .ctx b{display:block;font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11.5px,1.15vw,14px);line-height:1.25}
.g-node .ctx small{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.g-node.active .ctx b{color:var(--accent2)}
/* cam panel */
.panel{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9)}
@media(max-width:980px){
  .hub{grid-template-columns:1fr}
  .tilt{max-width:470px}
  .panel{height:auto;max-height:76vh;min-height:440px}
}
@media(max-width:560px){
  .tilt{max-width:370px}
  .g-node .ctx small{display:none}
  .panel-visual{height:110px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

const panelEl=document.getElementById('panel');
let current=-1,visTimer=null;

const tiltEl=document.getElementById('tilt'),scene=document.getElementById('scene');
PRODUCTS.forEach((g,i)=>{
  const ang=(i*90+225)*Math.PI/180,R=40;
  const x=50+R*Math.cos(ang),y=50+R*Math.sin(ang);
  const count=g.cats.reduce((s,c)=>s+c.items.length,0);
  const nd=document.createElement('button');
  nd.className='g-node';nd.type='button';nd.dataset.i=i;
  nd.style.left=x+'%';nd.style.top=y+'%';
  nd.style.animationDelay=(i*.8)+'s';
  nd.innerHTML=`<span class="cimg"><img src="${g.imgs[0]}" alt=""></span><span class="ctx"><b>${g.name}</b><small>${count} alt başlık</small></span>`;
  nd.addEventListener('mouseenter',()=>select(i,false));
  nd.addEventListener('click',()=>select(i,true));
  tiltEl.appendChild(nd);
});

// 3D eğim: fare sahne üzerinde gezerken tüm küme hafifçe döner
scene.addEventListener('mousemove',e=>{
  const r=scene.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  tiltEl.style.transform=`rotateY(${(px*9).toFixed(2)}deg) rotateX(${(-py*9).toFixed(2)}deg)`;
});
scene.addEventListener('mouseleave',()=>{tiltEl.style.transform=''});

function select(i,fromClick){
  if(current===i){
    if(fromClick&&matchMedia('(max-width:980px)').matches)panelEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  current=i;
  document.querySelectorAll('.g-node').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));
  renderPanel(PRODUCTS[i]);
  panelEl.classList.remove('panel-fade');void panelEl.offsetWidth;panelEl.classList.add('panel-fade');
  startVisual();
  if(fromClick&&matchMedia('(max-width:980px)').matches)panelEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function itemHTML(it){
  const link=it.u?`<br><a href="${it.u}" target="_blank" rel="noopener">Ürün sayfası
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>`:'';
  return `<div class="sub-item">
    <button type="button"><span class="dot"></span>${it.n}
      <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="si-body"><div class="si-in">${it.d}${link}</div></div>
  </div>`;
}
function renderPanel(g){
  const count=g.cats.reduce((s,c)=>s+c.items.length,0);
  panelEl.innerHTML=`
    <div class="panel-visual">${g.imgs.map((s,k)=>`<img src="${s}" alt="" class="${k===0?'on':''}">`).join('')}</div>
    <div class="panel-head"><span class="p-ic">${ICONS[g.icon]}</span>
      <div><h3>${g.name}</h3><div class="p-count">${count} alt başlık · detay için tıklayın</div></div>
    </div>
    <div class="panel-desc">${g.desc}</div>
    <div class="panel-body">${g.cats.map(c=>(c.t?`<div class="sub-cat">${c.t}</div>`:'')+c.items.map(itemHTML).join('')).join('')}</div>
    <div class="panel-foot">
      <a class="visit-btn" href="${g.site}" target="_blank" rel="noopener">Sitemizi Ziyaret Et — ${g.siteLabel}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
    </div>`;
}
function startVisual(){
  clearInterval(visTimer);
  const imgs=[...panelEl.querySelectorAll('.panel-visual img')];
  if(imgs.length<2||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let v=0;
  visTimer=setInterval(()=>{
    imgs[v].classList.remove('on');
    v=(v+1)%imgs.length;
    imgs[v].classList.add('on');
  },3600);
}
panelEl.addEventListener('click',e=>{
  const btn=e.target.closest('.sub-item>button');
  if(!btn)return;
  btn.parentElement.classList.toggle('open');
});
select(0,false);
</script>
