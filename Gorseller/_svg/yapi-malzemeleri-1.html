<body style="margin:0;padding:0">
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#E8ECF3"/>
</linearGradient>
<linearGradient id="sack" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#24356E"/><stop offset="0.5" stop-color="#1B2A5E"/><stop offset="1" stop-color="#141F49"/>
</linearGradient>
<linearGradient id="sackW" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F2F2F0"/><stop offset="1" stop-color="#DDDEE0"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E6E9EE"/><stop offset="0.5" stop-color="#AEB6C2"/><stop offset="1" stop-color="#8C95A4"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<!-- watermark hexagon -->
<polygon points="500,60 830,250 830,640 500,830 170,640 170,250" fill="none" stroke="#D7DDE8" stroke-width="3"/>
<polygon points="500,110 785,275 785,615 500,780 215,615 215,275" fill="none" stroke="#E2E7F0" stroke-width="2"/>
<!-- corner connectors -->
<circle cx="80" cy="80" r="10" fill="#E30613"/><rect x="98" y="76" width="120" height="8" rx="4" fill="#1B2A5E"/>
<circle cx="920" cy="920" r="10" fill="#E30613"/><rect x="782" y="916" width="120" height="8" rx="4" fill="#1B2A5E"/>
<!-- ground shadow -->
<ellipse cx="500" cy="800" rx="360" ry="42" fill="#1B2A5E" opacity="0.16" filter="url(#soft)"/>
<!-- pallet -->
<g>
<rect x="220" y="762" width="560" height="26" rx="6" fill="#C89A5B"/>
<rect x="240" y="788" width="60" height="24" rx="4" fill="#A87C43"/>
<rect x="470" y="788" width="60" height="24" rx="4" fill="#A87C43"/>
<rect x="700" y="788" width="60" height="24" rx="4" fill="#A87C43"/>
<rect x="220" y="748" width="560" height="18" rx="6" fill="#B8894D"/>
</g>
<!-- back row sacks -->
<g>
<rect x="265" y="470" width="220" height="290" rx="26" fill="url(#sack)"/>
<rect x="265" y="470" width="220" height="290" rx="26" fill="none" stroke="#0E1735" stroke-width="3" opacity="0.4"/>
<ellipse cx="375" cy="478" rx="96" ry="20" fill="#2E4485"/>
<rect x="265" y="570" width="220" height="86" fill="#FFFFFF"/>
<rect x="265" y="570" width="220" height="12" fill="#E30613"/>
<rect x="265" y="644" width="220" height="12" fill="#E30613"/>
<text x="375" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#1B2A5E">ÇİMENTO</text>
</g>
<g>
<rect x="555" y="470" width="220" height="290" rx="26" fill="url(#sackW)"/>
<rect x="555" y="470" width="220" height="290" rx="26" fill="none" stroke="#B8BDC7" stroke-width="3"/>
<ellipse cx="665" cy="478" rx="96" ry="20" fill="#FFFFFF" stroke="#C9CEd8" stroke-width="2"/>
<rect x="555" y="570" width="220" height="86" fill="#1B2A5E"/>
<text x="665" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#FFFFFF">BEYAZ</text>
<text x="665" y="646" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#E8ECF3">ÇİMENTO</text>
</g>
<!-- front sack leaning -->
<g transform="rotate(-7 500 700)">
<rect x="400" y="610" width="200" height="180" rx="24" fill="url(#sack)"/>
<ellipse cx="500" cy="618" rx="88" ry="18" fill="#2E4485"/>
<rect x="400" y="664" width="200" height="62" fill="#FFFFFF"/>
<rect x="400" y="664" width="200" height="10" fill="#E30613"/>
<rect x="400" y="716" width="200" height="10" fill="#E30613"/>
<text x="500" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#1B2A5E">CEM I</text>
</g>
<!-- trowel -->
<g transform="rotate(24 810 640)">
<polygon points="760,560 860,560 826,712 794,712" fill="url(#metal)" stroke="#7C8494" stroke-width="2"/>
<rect x="800" y="500" width="20" height="66" rx="8" fill="#8C95A4"/>
<rect x="790" y="440" width="40" height="70" rx="16" fill="#E30613"/>
</g>
<!-- floating hex chips -->
<g opacity="0.95">
<polygon points="180,300 222,324 222,372 180,396 138,372 138,324" fill="#1B2A5E"/>
<rect x="164" y="332" width="32" height="32" rx="6" fill="none" stroke="#E30613" stroke-width="5"/>
<polygon points="838,300 880,324 880,372 838,396 796,372 796,324" fill="#FFFFFF" stroke="#1B2A5E" stroke-width="4"/>
<circle cx="838" cy="348" r="14" fill="#E30613"/>
</g>
<!-- dust particles -->
<circle cx="300" cy="430" r="6" fill="#C9CFDB"/><circle cx="690" cy="420" r="5" fill="#C9CFDB"/><circle cx="540" cy="400" r="4" fill="#D7DDE8"/>
</svg>
</body>
