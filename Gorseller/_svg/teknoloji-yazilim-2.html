<body style="margin:0;padding:0">
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#E8ECF3"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E6E9EE"/><stop offset="0.5" stop-color="#AEB6C2"/><stop offset="1" stop-color="#8C95A4"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<polygon points="500,60 830,250 830,640 500,830 170,640 170,250" fill="none" stroke="#D7DDE8" stroke-width="3"/>
<circle cx="80" cy="80" r="10" fill="#E30613"/><rect x="98" y="76" width="120" height="8" rx="4" fill="#1B2A5E"/>
<circle cx="920" cy="920" r="10" fill="#E30613"/><rect x="782" y="916" width="120" height="8" rx="4" fill="#1B2A5E"/>
<ellipse cx="500" cy="836" rx="380" ry="38" fill="#1B2A5E" opacity="0.15" filter="url(#soft)"/>
<!-- robotic arm -->
<g>
<!-- base -->
<rect x="180" y="740" width="260" height="60" rx="14" fill="#1B2A5E"/>
<rect x="240" y="690" width="140" height="60" rx="12" fill="#2E4485"/>
<!-- lower arm -->
<g>
<rect x="286" y="420" width="56" height="300" rx="28" fill="url(#metal)" stroke="#7C8494" stroke-width="3" transform="rotate(14 314 570)"/>
</g>
<circle cx="310" cy="700" r="44" fill="#1B2A5E"/><circle cx="310" cy="700" r="20" fill="#E30613"/>
<!-- upper arm -->
<rect x="330" y="380" width="300" height="54" rx="27" fill="url(#metal)" stroke="#7C8494" stroke-width="3" transform="rotate(-12 350 420)"/>
<circle cx="352" cy="430" r="38" fill="#1B2A5E"/><circle cx="352" cy="430" r="16" fill="#E30613"/>
<!-- wrist -->
<circle cx="640" cy="352" r="32" fill="#1B2A5E"/><circle cx="640" cy="352" r="13" fill="#E30613"/>
<!-- gripper -->
<g stroke="#7C8494" stroke-width="3">
<path d="M665,340 Q730,320 740,270 L770,286 Q756,352 690,372 Z" fill="url(#metal)"/>
<path d="M668,368 Q730,380 748,430 L720,448 Q700,398 660,392 Z" fill="url(#metal)"/>
</g>
<!-- held hex nut -->
<polygon points="790,330 826,351 826,393 790,414 754,393 754,351" fill="#E30613"/>
<circle cx="790" cy="372" r="16" fill="#FFFFFF"/>
</g>
<!-- conveyor with boxes -->
<g>
<rect x="560" y="700" width="360" height="34" rx="17" fill="#1B2A5E"/>
<circle cx="600" cy="717" r="10" fill="#8FA0CE"/><circle cx="680" cy="717" r="10" fill="#8FA0CE"/><circle cx="760" cy="717" r="10" fill="#8FA0CE"/><circle cx="840" cy="717" r="10" fill="#8FA0CE"/>
<rect x="590" y="620" width="80" height="80" rx="8" fill="#C89A5B" stroke="#A87C43" stroke-width="3"/>
<line x1="630" y1="620" x2="630" y2="700" stroke="#A87C43" stroke-width="3"/>
<rect x="740" y="620" width="80" height="80" rx="8" fill="#C89A5B" stroke="#A87C43" stroke-width="3"/>
<line x1="740" y1="660" x2="820" y2="660" stroke="#A87C43" stroke-width="3"/>
</g>
<!-- circuit lines top -->
<g stroke="#1B2A5E" stroke-width="5" fill="none">
<path d="M160,220 L280,220 L320,180 L440,180"/>
<path d="M560,150 L660,150 L700,190 L820,190"/>
</g>
<circle cx="160" cy="220" r="10" fill="#E30613"/><circle cx="440" cy="180" r="10" fill="#1B2A5E"/>
<circle cx="560" cy="150" r="10" fill="#1B2A5E"/><circle cx="820" cy="190" r="10" fill="#E30613"/>
<!-- signal waves from wrist -->
<g stroke="#E30613" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
<path d="M600,270 a70,70 0 0 1 80,-10"/>
<path d="M580,230 a110,110 0 0 1 126,-16"/>
</g>
</svg>
</body>
