<body style="margin:0;padding:0">
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#E6EAF1"/>
</linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F2F4F8"/><stop offset="0.45" stop-color="#B9C0CC"/><stop offset="0.55" stop-color="#98A1B0"/><stop offset="1" stop-color="#C8CED9"/>
</linearGradient>
<linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#EDF0F5"/><stop offset="0.5" stop-color="#A7AFBD"/><stop offset="1" stop-color="#D2D7E0"/>
</linearGradient>
<radialGradient id="pipeFace" cx="0.35" cy="0.35" r="0.9">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="0.7" stop-color="#B9C0CC"/><stop offset="1" stop-color="#8C95A4"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<polygon points="500,60 830,250 830,640 500,830 170,640 170,250" fill="none" stroke="#D7DDE8" stroke-width="3"/>
<circle cx="80" cy="80" r="10" fill="#E30613"/><rect x="98" y="76" width="120" height="8" rx="4" fill="#1B2A5E"/>
<circle cx="920" cy="920" r="10" fill="#E30613"/><rect x="782" y="916" width="120" height="8" rx="4" fill="#1B2A5E"/>
<ellipse cx="500" cy="830" rx="380" ry="40" fill="#1B2A5E" opacity="0.15" filter="url(#soft)"/>
<!-- I-beam -->
<g transform="rotate(-6 300 620)">
<rect x="150" y="430" width="300" height="52" rx="8" fill="url(#steel)" stroke="#7C8494" stroke-width="2"/>
<rect x="255" y="482" width="90" height="230" fill="url(#steelV)" stroke="#7C8494" stroke-width="2"/>
<rect x="150" y="712" width="300" height="52" rx="8" fill="url(#steel)" stroke="#7C8494" stroke-width="2"/>
</g>
<!-- pipes stacked (cross-sections) -->
<g stroke="#7C8494" stroke-width="3">
<circle cx="600" cy="720" r="78" fill="url(#pipeFace)"/><circle cx="600" cy="720" r="46" fill="#4A5468"/><circle cx="600" cy="720" r="40" fill="#333B4D"/>
<circle cx="760" cy="720" r="78" fill="url(#pipeFace)"/><circle cx="760" cy="720" r="46" fill="#4A5468"/><circle cx="760" cy="720" r="40" fill="#333B4D"/>
<circle cx="680" cy="590" r="78" fill="url(#pipeFace)"/><circle cx="680" cy="590" r="46" fill="#4A5468"/><circle cx="680" cy="590" r="40" fill="#333B4D"/>
</g>
<!-- long pipe diagonal -->
<g transform="rotate(-32 640 360)">
<rect x="430" y="330" width="440" height="64" rx="32" fill="url(#steel)" stroke="#7C8494" stroke-width="2"/>
<ellipse cx="870" cy="362" rx="16" ry="32" fill="#4A5468"/>
<rect x="470" y="342" width="360" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>
</g>
<!-- square profile top-left -->
<g stroke="#7C8494" stroke-width="3" transform="rotate(14 230 270)">
<rect x="187" y="227" width="86" height="86" rx="10" fill="url(#pipeFace)"/>
<rect x="204" y="244" width="52" height="52" rx="6" fill="#333B4D"/>
</g>
<!-- INOX badge -->
<polygon points="500,190 556,222 556,286 500,318 444,286 444,222" fill="#1B2A5E"/>
<text x="500" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#FFFFFF">INOX</text>
<circle cx="500" cy="216" r="0" fill="#E30613"/>
<rect x="474" y="276" width="52" height="6" rx="3" fill="#E30613"/>
<!-- sparkles on steel -->
<g fill="#FFFFFF">
<path d="M560,470 l6,-18 l6,18 l18,6 l-18,6 l-6,18 l-6,-18 l-18,-6 z"/>
<path d="M340,410 l5,-14 l5,14 l14,5 l-14,5 l-5,14 l-5,-14 l-14,-5 z" opacity="0.9"/>
<path d="M810,560 l5,-14 l5,14 l14,5 l-14,5 l-5,14 l-5,-14 l-14,-5 z" opacity="0.9"/>
</g>
</svg>
</body>
