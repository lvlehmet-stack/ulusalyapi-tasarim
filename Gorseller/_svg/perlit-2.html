<body style="margin:0;padding:0">
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#DFE5EF"/>
</linearGradient>
<linearGradient id="volcano" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3A4870"/><stop offset="1" stop-color="#16224E"/>
</linearGradient>
<radialGradient id="gran" cx="0.35" cy="0.3" r="1">
<stop offset="0" stop-color="#FFFFFF"/><stop offset="0.75" stop-color="#E8EAEE"/><stop offset="1" stop-color="#C0C6D1"/>
</radialGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#sky)"/>
<polygon points="500,60 830,250 830,640 500,830 170,640 170,250" fill="none" stroke="#D7DDE8" stroke-width="3"/>
<circle cx="80" cy="80" r="10" fill="#E30613"/><rect x="98" y="76" width="120" height="8" rx="4" fill="#1B2A5E"/>
<circle cx="920" cy="920" r="10" fill="#E30613"/><rect x="782" y="916" width="120" height="8" rx="4" fill="#1B2A5E"/>
<!-- volcano origin -->
<g>
<path d="M120,640 L340,300 Q370,260 400,300 L620,640 Z" fill="url(#volcano)"/>
<path d="M340,300 Q370,260 400,300 L440,364 L392,340 L348,372 L310,344 Z" fill="#FFFFFF" opacity="0.9"/>
<!-- lava glow at crater -->
<path d="M338,296 Q370,270 402,296" fill="none" stroke="#E30613" stroke-width="12" stroke-linecap="round"/>
<circle cx="370" cy="270" r="26" fill="#E30613" opacity="0.35" filter="url(#soft)"/>
</g>
<!-- arrow transformation -->
<path d="M530,430 Q640,380 720,430" fill="none" stroke="#E30613" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
<polygon points="726,410 758,442 712,452" fill="#E30613"/>
<!-- expanded perlite pile -->
<g>
<path d="M600,760 Q790,600 940,760 Z" fill="#F2F3F6" stroke="#C9CFDB" stroke-width="4"/>
<g fill="url(#gran)" stroke="#B9BFCB" stroke-width="2">
<circle cx="700" cy="700" r="34"/><circle cx="770" cy="666" r="40"/><circle cx="850" cy="700" r="34"/><circle cx="738" cy="732" r="26"/><circle cx="810" cy="730" r="28"/><circle cx="770" cy="612" r="24"/>
</g>
<g fill="#AEB6C2" opacity="0.75">
<circle cx="692" cy="692" r="7"/><circle cx="712" cy="712" r="5"/><circle cx="762" cy="656" r="8"/><circle cx="784" cy="678" r="6"/><circle cx="844" cy="692" r="7"/><circle cx="806" cy="724" r="6"/><circle cx="766" cy="606" r="5"/>
</g>
</g>
<!-- ground line -->
<rect x="100" y="756" width="840" height="12" rx="6" fill="#1B2A5E"/>
<ellipse cx="520" cy="800" rx="380" ry="30" fill="#1B2A5E" opacity="0.12" filter="url(#soft)"/>
<!-- floating granules mid transformation -->
<g fill="url(#gran)">
<circle cx="580" cy="390" r="14"/><circle cx="636" cy="368" r="16"/><circle cx="690" cy="386" r="13"/>
</g>
<!-- heat waves under arrow -->
<g stroke="#E30613" stroke-width="6" fill="none" opacity="0.7" stroke-linecap="round">
<path d="M560,500 q14,-18 28,0 q14,18 28,0"/>
<path d="M640,510 q14,-18 28,0 q14,18 28,0"/>
</g>
<!-- 1000°C chip -->
<rect x="560" y="540" width="170" height="54" rx="27" fill="#1B2A5E"/>
<text x="645" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF">~1000°C</text>
<!-- badge -->
<polygon points="180,180 228,208 228,264 180,292 132,264 132,208" fill="#1B2A5E"/>
<circle cx="180" cy="236" r="20" fill="url(#gran)"/>
<circle cx="174" cy="230" r="4" fill="#8C95A4"/><circle cx="188" cy="242" r="3" fill="#8C95A4"/>
<circle cx="180" cy="204" r="6" fill="#E30613"/>
</svg>
</body>
