<body style="margin:0;padding:0">
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#E8ECF3"/>
</linearGradient>
<linearGradient id="plaster" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E7ED"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E6E9EE"/><stop offset="0.5" stop-color="#AEB6C2"/><stop offset="1" stop-color="#8C95A4"/>
</linearGradient>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<polygon points="500,60 830,250 830,640 500,830 170,640 170,250" fill="none" stroke="#D7DDE8" stroke-width="3"/>

<ellipse cx="500" cy="820" rx="380" ry="40" fill="#1B2A5E" opacity="0.15" filter="url(#soft)"/>
<!-- brick wall -->
<g>
<rect x="180" y="250" width="640" height="530" fill="#D9DEE7"/>
<!-- bricks: right portion visible -->
<g fill="#C0552F" stroke="#A8431F" stroke-width="2">
<rect x="500" y="260" width="150" height="60" rx="4"/><rect x="660" y="260" width="150" height="60" rx="4"/>

<rect x="425" y="470" width="150" height="60" rx="4"/><rect x="585" y="470" width="150" height="60" rx="4"/><rect x="745" y="470" width="65" height="60" rx="4"/>
<rect x="500" y="540" width="150" height="60" rx="4"/><rect x="660" y="540" width="150" height="60" rx="4"/>
<rect x="425" y="610" width="150" height="60" rx="4"/><rect x="585" y="610" width="150" height="60" rx="4"/><rect x="745" y="610" width="65" height="60" rx="4"/>
<rect x="500" y="680" width="150" height="60" rx="4"/><rect x="660" y="680" width="150" height="60" rx="4"/>

<!-- plaster layer covering left part, wavy edge -->
<path d="M180,250 L560,250 C520,300 585,340 545,390 C505,440 575,480 535,530 C495,580 565,620 525,670 C485,720 555,750 520,780 L180,780 Z" fill="url(#plaster)"/>
<path d="M560,250 C520,300 585,340 545,390 C505,440 575,480 535,530 C495,580 565,620 525,670 C485,720 555,750 520,780" fill="none" stroke="#C6CCD8" stroke-width="5" stroke-linecap="round"/>
<!-- frame -->
<rect x="180" y="250" width="640" height="530" fill="none" stroke="#1B2A5E" stroke-width="10"/>
</g>
<!-- trowel applying plaster -->
<g transform="rotate(-18 640 460)">
<rect x="560" y="430" width="190" height="58" rx="8" fill="url(#metal)" stroke="#7C8494" stroke-width="2"/>
<rect x="740" y="446" width="52" height="22" rx="8" fill="#8C95A4"/>
<rect x="786" y="434" width="86" height="44" rx="20" fill="#E30613"/>

<!-- level tool bottom -->
<g transform="rotate(-4 420 880)">
<rect x="200" y="856" width="440" height="44" rx="10" fill="#F4B324" stroke="#D69A0F" stroke-width="3"/>
<rect x="390" y="862" width="60" height="32" rx="8" fill="#FFFFFF" stroke="#B8BDC7" stroke-width="2"/>

<rect x="586" y="862" width="26" height="32" rx="4" fill="#D69A0F"/>

<path d="M735,760 L825,760 L810,880 L750,880 Z" fill="#1B2A5E"/>

<rect x="760" y="806" width="40" height="10" rx="5" fill="#E30613"/>

<polygon points="160,180 202,204 202,252 160,276 118,252 118,204" fill="#1B2A5E"/>

</svg>
